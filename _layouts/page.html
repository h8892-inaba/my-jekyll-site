---
layout: default
---

{% assign repo_url = "https://github.com//h8892-inaba/my-jekyll-site/blob/site" %}

<section class="container">
  <h1>{{ page.title }}</h1>
   <a href="{{ repo_url }}/{{ page.path }}" target="_blank">
    ✏️ Edit this page on GitHub
  </a>

  <h3>Contents</h3>
  <div class="blog-post-toc m-1">
          {% include toc.html html=content %}
        </div>
  <article>
	<div>
		{{ content }}
	</div>
  </article>
</section>
