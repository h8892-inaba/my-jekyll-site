<link rel="stylesheet" href="{{ "/assets/css/hover-dropdown.css" | relative_url }}">
<header class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <nav class="container">
    <!-- site home -->
    <a class="navbar-brand" href="{{ '/' | absolute_url }}">
      <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo" height="32" width="32">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor01"
      aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarColor01">
      <ul class="navbar-nav mr-auto">
        <!-- TODO add theme version dropdown here -->
        <!-- {%- for link in site.data.nav.header -%}
          {%- if link.url contains '://' -%}
            {%- assign url = link.url -%}
          {%- else -%}
            {%- assign url = link.url | relative_url -%}
	    {%- endif -%} -->
        <!-- li class="nav-item">
          <a class="nav-link" href="{{ url }}" {% if link.description %} title="{{ link.description}}"
            {% endif %}>{{ link.title }}</a-->
    <li class="nav-item dropdown">
  <a class="nav-link dropdown-toggle" href="{{ link.url | relative_url }}" data-toggle="dropdown">
    {{ link.title }}
  </a>
	  {% if link.children %}
	  <div class="dropdown-menu">
		{% for child in link.children %}
			{% if child.title %}
				{% for grand in link.children %}
				<a href="{{ site.baseurl}}/{{grand.url}}">{{ grand.title }}</a>
				{% endfor %}>
			{% endif %}
		{% endfor %}
	  </div>
	  {% endif %}
	  <!-- add nav code -->

	  <!-- {% if item.children %}
          <ul class="dropdown">
            {% for child in item.children %}
              <li><a href="{{ child.url }}">{{ child.title }}</a></li>
            {% endfor %}
          </ul>
	  {% endif %}-->
        </li>

	<!-- {%- endfor -%}-->
      </ul>
      {% if site.search == true %}
        {%- include search-providers/search_form.html -%}
      {% endif %}
    </div>
  </nav>
</header>
